name: Deploy to Production

on:
  push:
    branches: [main]

env:
  GITHUB_USER: ${{ github.repository_owner }}

jobs:
  # ───────────────────────────────────────────
  # 1. Test
  # ───────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/backend/pnpm-lock.yaml

      - name: Install backend deps
        run: pnpm install
        working-directory: apps/backend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install catalog deps
        run: make catalog-install

      - name: Run all tests
        run: make test

  # ───────────────────────────────────────────
  # 2. Build & push images to GHCR
  # ───────────────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io
    outputs:
      tag: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatic, no secret needed

      - name: Build & push backend
        run: make push-backend GITHUB_USER=${{ env.GITHUB_USER }} TAG=${{ steps.tag.outputs.sha }}

      - name: Build & push catalog
        run: make push-catalog GITHUB_USER=${{ env.GITHUB_USER }} TAG=${{ steps.tag.outputs.sha }}

  # ───────────────────────────────────────────
  # 3. Deploy to Oracle VM
  # ───────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            TAG="${{ needs.build.outputs.tag }}"
            BACKEND="ghcr.io/${{ env.GITHUB_USER }}/nutria-backend:$TAG"
            CATALOG="ghcr.io/${{ env.GITHUB_USER }}/nutria-catalog:$TAG"

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull $BACKEND
            docker pull $CATALOG

            # Blue/green backend
            docker run -d --name nutria-backend-new --env-file /app/.env.production -p 4112:4111 $BACKEND
            sleep 5
            docker exec nutria-backend-new curl -sf http://localhost:4111/health || exit 1
            sed -i 's/localhost:[0-9]*/localhost:4112/' /etc/nginx/conf.d/backend.conf
            nginx -s reload
            docker rm -f nutria-backend || true
            docker rename nutria-backend-new nutria-backend

            # Catalog (simpler — restart in place)
            docker rm -f nutria-catalog || true
            docker run -d --name nutria-catalog --env-file /app/.env.catalog.production -p 8000:8000 $CATALOG

            docker image prune -f
