[project]
name = "nutria-catalog"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    # FastAPI and server
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    # Database and ORM
    "sqlmodel>=0.0.14",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.12.0",
    "pgvector>=0.2.4",
    # Configuration and environment
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # JWT Authentication
    "PyJWT[crypto]>=2.8.0",
    # Password hashing
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    # Additional utilities
    "python-multipart>=0.0.6",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    # PDF Generation
    "reportlab>=4.0.0",
    # PDF parsing for eval ingestion
    "pdfplumber>=0.10.0",
    # Embeddings for eval document_chunks
    "sentence-transformers>=3.0.0",
    # CLI
    "typer>=0.12.0",
    "boto3>=1.43.6",
    "openai>=1.0.0",
    "fastapi-csrf-protect>=1.0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
